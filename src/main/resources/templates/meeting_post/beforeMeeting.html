<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js"
            integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>
<body>
<div class="container bg-color">
    

    <div class="d-flex justify-content-between">
        <!-- 모임참가 관련 정보들 -->
        <div>
            <div class="d-flex">
                <div><h2>모이는 위치</h2></div>
                <div><span th:text="${meetingPost.location}"></span></div>
                
            </div>
            <div>
                    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=dd189a1a763710dd5dc72319d26d4284&autoload=false"></script>
                    <div id="map" style="width:300px; height:200px;">맵</div>

            </div>

            <div class=" ">
                <th:block th:if="${meetingPost.exerciseType == 'RUNNING'}">
                    <div class="d-flex">
                        <div><span>예상 페이스: km당   </span></div>
                        <div><span th:text="${meetingPost.speed_min}">0</span>분</div>
                        <div><span th:text="${meetingPost.speed_sec}">0</span>초</div>
                       
                    </div>
                </th:block>
                <th:block th:unless="${meetingPost.exerciseType == 'RUNNING'}">
                    <div class="d-flex ml-3">
                        <div><span>예상 파워:</span></div>
                        <div><span th:text="${meetingPost.power}">300</span></div>
                        <div><span>W</span></div>
                    </div>
                </th:block>
                <div class="d-flex ml-4">
                    <div><h4>운동 거리</h4></div>
                    <div><span th:text="${meetingPost.distance}">100</span></div>
                    <div><span>km</span></div>
                </div>
                <div class="d-flex"> 
                    <h4>운동 시간</h4>
                    
                        <span   id="duration"  
                                th:text="${meetingPost.duration != null ? meetingPost.duration / 60 : ''}" >
                            </span>
                     
                    <span>분</span>

                </div>
                <div class="d-flex mt-2">
                    <div style="width:150px;"> 고도(10m단위)</div>
                    <div><span  id="height"    th:text="${meetingPost.height}"></span></div>
                </div>
            </div>

            <div class="d-flex">
                <div><span>중간 보급</span></div>
                <div><span th:text="${meetingPost.restLocation}"></span></div>
               
            </div>
             <div>
                    <div><span>설명</span></div>
                    <div><span type="text" th:text="${meetingPost.contentText}" style="width:300px;height:75px"></span></div>
            </div>

            <div class="d-flex justify-content-start" th:if="${meetingPost.isAbandonOkay}">
                <span class="text-danger">주의: 흐르면 버리는 번개입니다</span>
            </div>
        </div>

        <!-- 잡다한 정보들 -->
        <div>
            <div class="d-flex">
                <div><span>leader: </span></div>
                <div><span th:text="${meetingPost.userName}">나 사나이다</span></div>
            </div>

            <div>
                <div><h2>참가자 list</h2></div>
                <div>
                    <!-- join dto 리스트 출력 예시 -->
                    <div class="d-flex join-dto" th:each="joinDto : ${meetingPost.meetingJoinList}">
                        <div><span th:text="${joinDto.userName}">jihyung97</span></div>
                        <th:block th:if="${meetingPost.exerciseType == 'CYCLE'}">
                            <div class="ml-2"><span th:text="${joinDto.power}">0W</span></div>
                        </th:block>

                        <th:block th:if="${meetingPost.exerciseType == 'RUNNING'}">
                            <div class="ml-2"><span th:text="${joinDto.speed}">0</span></div>
                        </th:block>



                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class=" ">
        <div class="d-flex justify-content-end" id="before-meeting" th:data-post-id="${meetingPost.postId}" th:data-userId="${meetingPost.userId}">
            <div>
                <div class="d-flex">
                    <div><h4>남은시간:</h4></div>
                    <div><h4 th:text="${meetingPost.remainedTime}">00시간 00분</h4></div>  
                </div>
                <div class="d-flex">
                    <div><span th:text="${meetingPost.currentHeadCount}">0명</span></div>
                    <div><h1>/</h1></div>
                    <div><span th:text="${meetingPost.maxHeadCount}">5명</span></div>
                </div>
            </div>
         </div>
        <!-- 댓글 리스트 -->
          <div><h2>댓글 리스트</h2></div>
        <div id="comment-section" style="  overflow-y: auto;     border: 1px solid #ccc; ">
           
            <div th:each="comment : ${meetingPost.commentList}">
                <div class="d-flex comment-dto">
                    <div><span th:text="${comment.userName}">나는 쉬지롱</span></div>
                    <div class="ml-2"><span th:text="${comment.content}">어우 고생들 많으십니다^^</span></div>
                    
                    <button id="btn-delete-comment"
                        th:if="${meetingPost.userId == comment.userId}"
                        th:data-userId="${comment.userId}"
                        th:data-commentId="${comment.id}">
                        삭제
                    </button>
                </div>
            </div>
           
        </div>
         <div class="d-flex mt-2">
                <input type="text"  id="comment-content" placeholder="댓글 작성">
                <button id="btn-comment">댓글 달기</button>
        </div>

        <!-- ftp, strava 연동, 참가버튼 -->
        <div>
            <div class="d-flex justify-content-between">
                <div>
                    <div><span>ftp: <span th:text="${meetingPost.power}">300</span>W</span></div>
                    <div><span>pace: <span th:text="${meetingPost.speed}">3:30</span>min/km</span></div>
                </div>
                <div>
                    <div class="d-flex">
                       <span > 내 ftp</span>
                       <span th:text="${meetingPost.myPower}"></span>
                       
                    </div>
                    <div>
                        <button id="btn-connect-cycle" class="form-control">자전거 strava연동</button>
                        
                    </div>
                </div>
            </div>

            <div class="d-flex mt-3">

                <th:block th:if="${userType == 'none'}">
          
       
                    <div class="d-flex">
                        <div><span>모든 사고 책임은 개인에게 있음을 동의합니다</span></div>
                        <div><input type="checkbox" name="agreePolicy" id="isSafetyAgree"></div>
                    </div>
                    <div class="ml-3">
                        <button id="btn-join">참가</button>
                    </div>
                </th:block>
            </div>
            
        </div>
    </div>

    <div class="d-flex justify-content-end mt-4">

        <a href="/main-page/before-meeting">
            <button class="form-control">닫기</button>
        </a>

        <!-- userType이 leader일 때: 수정하기 버튼만 표시 -->
        <th:block th:if="${userType == 'leader'}">
          <a th:href="@{/meeting-post/make-meeting(postId=${meetingPost.postId})}">
         <button class="form-control">수정하기</button>
</a>

        </th:block>

        <!-- userType이 member일 때: 모임취소 버튼만 표시 -->
        <th:block th:if="${userType == 'member'}">
            <button>모임취소</button>
        </th:block>

        <!-- userType이 none일 때: 모임참가 버튼만 표시 -->
        <input type="hidden" id="latitude" name="latitude" th:value="${meetingPost.latitude}">
        <input type="hidden" id="longitude" name="longitude" th:value="${meetingPost.longitude}">
    </div>
</div>

<script>
    kakao.maps.load(function () {
        var mapContainer = document.getElementById('map');
            let latitude = $("#latitude").val();
            let longitude = $("#longitude").val();

            var infowindow = new kakao.maps.InfoWindow({zIndex:1});


            let lat = parseFloat(latitude);
            let lng = parseFloat(longitude);
        var mapOption = {
              center: new kakao.maps.LatLng(lat , lng ),
            level: 3
        };
        var map = new kakao.maps.Map(mapContainer, mapOption);


          

            var marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(lat, lng)  // 꼭 LatLng 객체로 생성
            });
            marker.setMap(map);
    });
</script>
<script>
    $(function(){
      $("#btn-join").on("click", function () {
                
                let isSafetyAgree = $("#isSafetyAgree").is(":checked");
               let postId = $("#before-meeting").data("postId");
                
                alert(isSafetyAgree);
              
                     
                    $.ajax({
                        url: "/meeting-join/create"  , 
                        type: "POST",
                        data: {"isSafetyAgree":isSafetyAgree, "postId":postId},
                       
                        success: function (data) {
                            alert(" 성공적으로 join  되었습니다");
                            // 필요 시 페이지 이동 또는 폼 초기화
                        },
                        error: function (data) {
                            console.error(data);
                            alert("제출 중 오류가 발생했습니다.");
                        }
                    });

    });

    $("#btn-comment").on("click", function () {
    
            let content = $("#comment-content").val();
            let postId = $("#before-meeting").data("postId");
            let isBeforeMeeting = true;
            
    
    
    
            
        $.ajax({
            url: "/comment/create"  , 
            type: "POST",
            data: {"content":content, "postId":postId, "isBeforeMeeting":isBeforeMeeting},
            
            success: function (data) {
                alert(" 성공적으로 댓글 작성 되었습니다");
                // 필요 시 페이지 이동 또는 폼 초기화
            },
            error: function (data) {
                console.error(data);
                alert("제출 중 오류가 발생했습니다.");
            }
        });

    });

    $("#btn-connect-cycle").on("click", function () {
            let postId = $("#before-meeting").data("postId");
            let pageUrl = "/meeting-post/before-meeting?postId=" + postId;

            // AJAX 대신 location.href로 직접 이동
            window.location.href = "/strava-api/connect-cycle?pageUrl=" + encodeURIComponent(pageUrl);
    });

</body>
</html>
