<script>
 function updateThumbnails() {
       let oldThumbnailListjson = localStorage.getItem('oldThumbnailList');
        let updatedAtOfthumbnailList = localStorage.getItem('updatedAtOfthumbnailList');
          const latAtStorage = localStorage.getItem('latAtStorage');
          const lngAtStorage = localStorage.getItem('lngAtStorage');
          const idAtStorage = localStorage.getItem('idAtStorage');

              if (!oldThumbnailListjson) {
                oldThumbnailListjson = JSON.stringify([]);  // 빈 리스트
              }
             

          console.log("updateThumbnails 호출됨");

          $.ajax({
            url: '/meeting-post/thumbnail/update',
            method: 'POST',
            data: {
              oldThumbnailListjson,
              updatedAtOfthumbnailList,
              latAtStorage,
              lngAtStorage,
              idAtStorage
            },
            dataType: 'json',
            success: function(response) {
              console.log("성공 응답:", response);

              localStorage.setItem('oldThumbnailList', JSON.stringify(response.thumbnailDtoList)); 
              localStorage.setItem('updatedAtOfthumbnailList', response.updatedAtOfthumbnailList);
              localStorage.setItem('latAtStorage', response.latAtStorage);
              localStorage.setItem('lngAtStorage', response.lngAtStorage);
              localStorage.setItem('idAtStorage', response.idAtStorage);
              

              const container = $('#meeting-post-section');
              container.empty();

              const posts = response.thumbnailDtoList;
              posts.forEach(post => {
                const isRunning = post.exerciseType === 'RUNNING';
                const postHtml = `
                  <a href="/meeting-post/before-meeting?postId=${post.id}" class="text-dark text-decoration-none">
                    <div class="m-3 meeting-post d-flex justify-content-between bg-color" style="cursor: pointer;">

                        <img alt="썸네일" src="${post.thumbnailUrl || ''}" />

                        ${isRunning ? `
                          <div>예상 페이스: km당 <span>${post.speed_min}</span>분 <span>${post.speed_sec}</span>초</div>
                        ` : `
                          <div>예상 파워: <span>${post.power}</span>W</div>
                          <div>예상 속도: <span>${post.speed}</span>km/h</div>
                        `}
                        <div>모임 장소: <span>${post.location}</span></div>
                      </div>

                        <div>남은 시간: <span>${post.remainedTime}</span></div>
                        <div><span>${post.currentHeadCount}</span> / <span>${post.maxHeadCount}</span></div>
                      </div>
                    </div>
                  </a>`;
                container.append(postHtml);
              });

              container.append(`
                <a href="/connect/strava">스트라바 연동하기</a>
                <button id="btn-connect-cycle">자전거 연동하기</button>
              `);
            },
            error: function(xhr, status, error) {
              console.error('API 호출 실패:', error);
            }
          });
        }

</script>



<script>
  let currentPage = 0;
  const itemsPerPage = 10;
  let isLoading = false;
  let finished = false;

  // Intersection Observer 세팅
  const observedTarget = document.createElement('div');
  observedTarget.id = "observer-target";
  document.getElementById("meeting-post-section").appendChild(observedTarget); //동적으로 target생성

  const observer = new IntersectionObserver(handleIntersect, {
    root: null,
    rootMargin: "0px",
    threshold: 0.1
  }); //intersectionObserver의 기능으로 observedTarget에서 0.1만큼 겹칠때 handleIntersect 작동
  observer.observe(observedTarget); //observedTarget에서 0.1만큼 겹칠때

  function handleIntersect(entries) {
    if (entries[0].isIntersecting && !isLoading && !finished) {
      loadMorePosts();
    }
  }

  function loadMorePosts() {
    isLoading = true;

    const oldThumbnailListJson = localStorage.getItem("oldThumbnailList") || "[]";
    const oldThumbnailList = JSON.parse(oldThumbnailListJson);

    const startIndex = currentPage * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;

    const pageItems = oldThumbnailList.slice(startIndex, endIndex);
    currentPage++;

    if (pageItems.length === 0) {
      finished = true;
      observer.unobserve(document.getElementById("observer-target"));
      return;
    }

    appendMeetingPosts(pageItems);
    isLoading = false;
  }

  function appendMeetingPosts(thumbnailList) {
    const container = document.getElementById("meeting-post-section");
    for (const post of thumbnailList) {
      const a = document.createElement("a");
      a.href = `/meeting-post/before-meeting?postId=${post.id}`;
      a.className = "text-dark text-decoration-none";

      const div = document.createElement("div");
      div.className = "m-3 meeting-post d-flex justify-content-between bg-color";
      div.style.cursor = "pointer";

      div.innerHTML = `
        <div id="image-thumbnail-section" class="bg-warning">
          <img src="${post.thumbnailUrl || ''}" alt="썸네일" />
        </div>
        <div>
          <div><span>${post.title}</span></div>
          ${
            post.exerciseType === 'RUNNING'
              ? `<div><span>예상 페이스: km 당</span> <span>${post.speed_min}</span>분 <span>${post.speed_sec}</span>초</div>`
              : `<div>예상 파워: <span>${post.power}</span> W</div>
                 <div>예상 속도: <span>${post.speed}</span> km/h</div>`
          }
          <div>모임 장소: <span>${post.location}</span></div>
        </div>
        <div>
          <div><span>남은 시간: </span><span>${post.remainedTime}</span></div>
          <div><span>${post.currentHeadCount}</span> / <span>${post.maxHeadCount}</span></div>
        </div>
      `;

      a.appendChild(div);
      container.insertBefore(a, document.getElementById("observer-target"));
    }
  }
</script>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=dd189a1a763710dd5dc72319d26d4284&libraries=services"></script>
 <script>
            var container = document.getElementById('map');
            var options = {
                center: new kakao.maps.LatLng(33.450701, 126.570667),
                level: 3
            };

            var map = new kakao.maps.Map(container, options);


            var infowindow = new kakao.maps.InfoWindow({zIndex:1});


            var marker = new kakao.maps.Marker({
                // 지도 중심좌표에 마커를 생성합니다
                position: map.getCenter()
              //  clickable: true
              });
            // 지도에 마커를 표시합니다
            marker.setMap(map);

            marker.setClickable(true);


            // 장소 검색 객체를 생성합니다
            var ps = new kakao.maps.services.Places();
            var geocoder = new kakao.maps.services.Geocoder();


                function searchLocation() {
                    var keyword = document.getElementById('keyword').value;
                     ps.keywordSearch(keyword, placesSearchCB);

                    
                 }

              
                kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                    searchDetailAddrFromCoords(mouseEvent.latLng, function(result, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            // var detailAddr = !!result[0].road_address ? '<div>도로명주소 : ' + result[0].road_address.address_name + '</div>' : '';
                            var detailAddr  = '<div>지번 주소 : ' + result[0].address.address_name + '</div>';
                            
                            var content = '<div class="bAddr">' +
                                            
                                            detailAddr + 
                                        '</div>';

                            // 마커를 클릭한 위치에 표시합니다 
                            marker.setPosition(mouseEvent.latLng);
                            marker.setMap(map);
                          $("#position-lng").text(mouseEvent.latLng.getLng());
                          $("#position-lat").text(mouseEvent.latLng.getLat());

                            // 인포윈도우에 클릭한 위치에 대한 법정동 상세 주소정보를 표시합니다
                            infowindow.setContent(content);
                            infowindow.open(map, marker);
                        }   
                    });
                     map.setDraggable(true);
                });

                function searchDetailAddrFromCoords(coords, callback) {
                    // 좌표로 법정동 상세 주소 정보를 요청합니다
                    geocoder.coord2Address(coords.getLng(), coords.getLat(), callback);
                }



                //  kakao.maps.event.addListener(map, 'click', function(mouseEvent) { 

                //          // 클릭한 위도, 경도 정보를 가져옵니다-->
                //          var latlng = mouseEvent.latLng; 

                //             marker.setPosition(latlng);
                //             marker.setMap(map);

                //        map.setDraggable(true);



                //    }); 
            // 키워드로 장소를 검색합니다


            // 키워드 검색 완료 시 호출되는 콜백함수 입니다
            function placesSearchCB (data, status, pagination) {
                if (status === kakao.maps.services.Status.OK) {

                    // 검색된 장소 위치를 기준으로 지도 범위를 재설정하기위해
                    // LatLngBounds 객체에 좌표를 추가합니다
                    var bounds = new kakao.maps.LatLngBounds();

                    for (var i=0; i<data.length; i++) {
                        displayMarker(data[i]);
                        bounds.extend(new kakao.maps.LatLng(data[i].y, data[i].x));
                    }

                    // 검색된 장소 위치를 기준으로 지도 범위를 재설정합니다
                    map.setBounds(bounds);
                }
            }

            // 지도에 마커를 표시하는 함수입니다
          function displayMarker(place) {

                    // 마커를 생성하고 지도에 표시합니다
            var marker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(place.y, place.x)
            });

            // 마커에 클릭이벤트를 등록합니다
            kakao.maps.event.addListener(marker, 'click', function() {
                // 마커를 클릭하면 장소명이 인포윈도우에 표출됩니다
                infowindow.setContent('<div style="padding:5px;font-size:12px;">' + place.place_name + '</div>');
                infowindow.open(map, marker);
                  const position = marker.getPosition();
                $("#position-lng").text(position.getLng());
                $("#position-lat").text(position.getLat());
            });
        }

             
















      </script>
